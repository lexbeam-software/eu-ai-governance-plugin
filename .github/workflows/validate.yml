name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          ref: tools
          path: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ../tools/scripts/validate.mjs
        working-directory: plugin
      - run: sh ../tools/scripts/claude-validate.sh
        working-directory: plugin
